name: Scheduled site audit

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce 48-hour schedule
        id: interval
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('should_run', 'true');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/scheduled-site-audit.yml',
              branch: 'main',
              event: 'schedule',
              status: 'completed',
              per_page: 20
            });
            let previous;
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              const auditRan = jobs.data.jobs.some(job =>
                job.steps?.some(step =>
                  step.name === 'Audit pages, assets, JavaScript, and production endpoints' &&
                  step.conclusion && step.conclusion !== 'skipped'
                )
              );
              if (auditRan) {
                previous = run;
                break;
              }
            }
            const elapsed = previous
              ? Date.now() - new Date(previous.updated_at).getTime()
              : Number.POSITIVE_INFINITY;
            core.setOutput('should_run', elapsed >= 48 * 60 * 60 * 1000 ? 'true' : 'false');

      - name: Check out published site
        if: steps.interval.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.interval.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit pages, assets, JavaScript, and production endpoints
        id: audit
        if: steps.interval.outputs.should_run == 'true'
        continue-on-error: true
        run: node scripts/audit-site.mjs

      - name: Open or update an issue on failure
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled site audit found a failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled static-site audit found a problem.',
              '',
              'This workflow checks published HTML and local assets, JavaScript syntax, GitHub Pages availability, and the employee-registration CORS preflight.',
              'It does not sign in, create users, upload files, modify code, or deploy fixes.',
              '',
              `Review the failing checks and logs: ${runUrl}`
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.data.find(issue =>
              !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close the audit issue after recovery
        if: steps.audit.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled site audit found a failure';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.data.find(issue =>
              !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The latest audit passed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Fail the workflow when checks fail
        if: steps.audit.outcome == 'failure'
        run: exit 1
